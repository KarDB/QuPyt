name: Tests

on: [push, pull_request, merge_group, workflow_dispatch]

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # setuptools-scm needs the repository's tags to determine its version.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run all tests
        run: python -m pytest tests -q

  quality:
    name: Lint, formatting and types
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check lint
        run: python -m ruff check qupyt tests source setup.py

      - name: Check formatting
        run: python -m black --check qupyt tests source setup.py

      - name: Check strict types
        run: python -m mypy

  checks:
    # Keep a single stable status check for branch protection.
    name: All tests
    needs: [tests, quality]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every test and quality job to pass
        env:
          TEST_RESULT: ${{ needs.tests.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          if [[ "$TEST_RESULT" != "success" || "$QUALITY_RESULT" != "success" ]]; then
            echo "Test matrix: $TEST_RESULT; quality checks: $QUALITY_RESULT"
            exit 1
          fi
