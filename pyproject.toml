[build-system]
requires = ["setuptools", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "qupyt"
dynamic = ["version"]
requires-python = ">=3.10"
description = "Provide a framework for quantum sensing experiments"
license = { text = "No license of for commercial or non-commercial use is granted" }
dependencies = [
    "numpy",
    "scipy",
    "harvesters",
    "matplotlib",
    "nidaqmx",
    "pulsestreamer",
    "pypylon",
    "pyserial",
    "PyVISA",
    "pyvisa-py",
    "PyYAML",
    "termcolor",
    "tqdm",
    "watchdog==3.0.0",
    "windfreak",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "black==24.4.2",
    "mypy==2.4.0",
    "pre-commit>=4.4.0",
    "pytest",
    "pytest-cov",
    "ruff==0.17.0",
]

[tool.setuptools.packages.find]
include = ["qupyt*"]

[tool.setuptools_scm]
write_to = "qupyt/_version.py"

[project.scripts]
qupyt = "qupyt.main:main"

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_configs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
warn_unreachable = true
disallow_any_unimported = true
show_column_numbers = true
strict = true
explicit_package_bases = true
follow_imports = "normal"
strict_optional = true
files = ["qupyt", "tests", "source", "setup.py"]

[tool.pylsp]
configurationSources = ["pyproject.toml"]

[tool.pylsp.plugins.pylint]
enabled = true
args = [
    "--disable=line-too-long",
    "--enable=logging-format-interpolation",
    "--disable=logging-fstring-interpolation",
]

[tool.black]
target-version = ["py310"]
line-length = 88
# Choose wrapping by line length rather than an existing trailing comma.
skip-magic-trailing-comma = true
extend-exclude = "qupyt/_version\\.py"

[tool.ruff]
target-version = "py310"
extend-exclude = ["qupyt/_version.py"]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F", "I", "ANN", "D2", "D3", "D4",
    "B006", "B007", "B008", "B023", "G004", "RUF059", "S506",
    "UP006", "UP007", "UP035", "UP045",
]
# Configuration values and optional hardware SDKs have dynamic types.
ignore = ["ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Logging must be initialized before optional hardware imports emit warnings.
"qupyt/main.py" = ["E402"]
